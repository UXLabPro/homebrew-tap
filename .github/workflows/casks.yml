name: Casks

# Lint on every cask change, and verify the real download whenever a release is
# published — that second one catches a wrong asset filename, a stale sha256, or
# a mistyped tag before a user meets it as a checksum error.
on:
  push:
    paths: ["Casks/**"]
  pull_request:
    paths: ["Casks/**"]
  release:
    types: [published]
  workflow_dispatch:

# Casks are macOS-only, so `brew audit --cask` needs a macOS runner. Free for
# public repos.
jobs:
  lint:
    runs-on: macos-latest
    steps:
      # HOMEBREW FIRST, THEN CHECKOUT INTO ITS TAPS DIRECTORY.
      #
      # Homebrew refuses to load a cask that is not inside a tap (it hardcodes
      # `<tap>/Casks` and matches `^Casks/….rb$`). The first attempt checked out
      # normally and symlinked the result into place, which failed: Homebrew
      # does not accept a symlinked tap. Checking out directly into
      # `…/Library/Taps/<owner>/homebrew-<name>` is the supported pattern, and
      # `repository-path` is the output the action publishes for exactly this.
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869

      - name: Check out the tap into Homebrew
        uses: actions/checkout@v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.repository-path }}/Library/Taps/uxlabpro/homebrew-tap

      - name: Confirm Homebrew sees the tap
        run: brew tap-info uxlabpro/tap

      # Homebrew 6 rejects third-party taps with a hard error until trusted;
      # CI hits the same wall a user does.
      - name: Trust the tap
        run: brew trust uxlabpro/tap

      - name: brew style
        run: brew style --cask uxlabpro/tap/place

      - name: brew audit (offline)
        run: brew audit --cask uxlabpro/tap/place

      # Downloads the ~97 MB DMG and checks it against the cask's sha256. Only
      # on a published release or a manual run, so ordinary edits stay fast.
      - name: brew audit (online, verifies the real asset)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: brew audit --cask --online uxlabpro/tap/place

      - name: brew livecheck (cask version vs the update feed)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: brew livecheck --cask uxlabpro/tap/place
